services:
  db:
    image: postgres:15
    container_name: trackform-db
    restart: always
    environment:
      POSTGRES_USER: user_treinos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_treinos}
      POSTGRES_DB: treinos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
